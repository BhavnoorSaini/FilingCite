[project]
name = "filingcite-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.2",
  "fastembed>=0.9.1",
  "openai>=3.44.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.6",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "docling-core>=2.105.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
ingest = [
    "docling>=2.145.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
